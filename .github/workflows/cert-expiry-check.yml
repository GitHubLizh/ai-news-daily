name: 证书到期检查

# 免费证书不支持阿里云的自动续期，只能手动换；而本项目启用了「拒绝非加密传输」的 Bucket Policy，
# 证书一过期整站就打不开。所以用这个 workflow 定期体检，快到期就开 Issue 并指派给你
# —— GitHub 对「被指派 / 被 @」的 Issue 会发邮件，等于邮件提醒，无需配置任何邮件凭据。

on:
  schedule:
    # 每月 1 日与 15 日 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 1,15 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制开一次提醒（用于验证邮件通道；即使还没到期）'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 查证书剩余天数
        id: cert
        run: |
          set -euo pipefail
          OUT=$(node scripts/cert-days.mjs latestainews.cn)
          echo "$OUT"
          # 只把 key=value 行写进 GITHUB_OUTPUT（人类可读那行不能进去，否则格式非法）
          echo "$OUT" | grep -E '^(days|expires|need_renew|authorized)=' >> "$GITHUB_OUTPUT"

      - name: 剩余不足 30 天就开 Issue 提醒（手动触发时可选强制）
        if: steps.cert.outputs.need_renew == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ steps.cert.outputs.days }}
          EXPIRES: ${{ steps.cert.outputs.expires }}
          NEED: ${{ steps.cert.outputs.need_renew }}
          FORCED: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # 闸门也写在脚本里：即使将来有人改了 step 的 if，也不会在没到期时误开 Issue
          if [ "${FORCED:-}" != "true" ] && [ "${NEED:-}" != "true" ]; then
            echo "证书还有 $DAYS 天到期，未到提醒阈值（30 天），且本次非强制触发 → 跳过提醒。"
            exit 0
          fi
          read -r -d '' BODY <<'EOF' || true
          ⚠️ **证书即将到期（免费证书不支持自动续期，阿里云官方限制），请在到期前手动换掉。**

          本项目启用了「拒绝非加密传输」的 Bucket Policy：**证书一过期，HTTP 会被策略拒绝、
          HTTPS 握不上手，网站彻底打不开，没有任何降级路径。**

          续期步骤（约 5 分钟）：

          1. **数字证书管理服务** → 「个人测试证书（原免费证书）」→ 申请新证书，域名填 `latestainews.cn`
             （额度 20 张/年；自动DNS验证可能仍需手动加一条 `_dnsauth` 的 TXT 记录）
          2. 签发后 → **OSS `域名管理` → `latestainews.cn` → 操作列「证书托管」→ 选新证书 → 上传**
          3. 验证：`curl -sS -o NUL -w '%{ssl_verify_result}' https://latestainews.cn/` 应返回 `0`

          完整清单见 `docs/deploy-oss-hongkong.md`。
          EOF
          # 手动强制触发且其实还没到期时，标题标明是测试，避免误以为真要续期了
          if [ "${FORCED:-}" = "true" ] && [ "${NEED:-}" != "true" ]; then
            TITLE="【测试】证书提醒通道验证（当前剩余 $DAYS 天，到期 $EXPIRES）"
            TEST_NOTE=$(printf '**【测试提醒｜无需操作】** 这条用来验证邮件通道。当前证书仍然有效：%s 到期，剩余 %s 天。\n\n若你能收到这封指派邮件，说明到期提醒通道正常，收到后直接关掉本 Issue 即可。\n\n---\n\n' "$EXPIRES" "$DAYS")
            BODY="${TEST_NOTE}${BODY}"
          else
            TITLE="⚠️ 证书将于 $EXPIRES 到期（剩余 $DAYS 天）"
          fi
          # 只匹配「真正的到期提醒」标题；测试 Issue 不会挡住后面真正的提醒
          EXISTING=$(gh issue list --state open --search '证书将于 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "已有未关闭的提醒 Issue #$EXISTING，追加评论（同样会触发通知）"
            gh issue comment "$EXISTING" --body "证书状态更新：到期日 $EXPIRES，剩余 $DAYS 天。"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "${{ github.repository_owner }}"
          fi
          echo "完成：已创建/更新提醒 Issue"