name: 刷新资讯并发布

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: '0 22 * * *'
    # 兜底：GitHub 的 schedule 是「尽力而为」，本仓库连续三天被排队推迟 2h44m–3h34m
    # （06:00 的槽位实际 08:44–09:34 才开跑）。UTC 00:30 = 北京时间 08:30 再排一次，
    # 万一 06:00 那次被延迟或被丢弃，当天资讯也还能在早上就位。
    # 重复执行是幂等的：数据没变化时提交步骤会跳过，OSS 同步 / Pages 部署重跑无副作用；
    # 下面 concurrency 组（cancel-in-progress: false）保证两个槽位排队串行，不会并发写同一分支。
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 放在 job 级 env 里，下面才能用 if 判断它是否已配置
    # （secrets 上下文不允许直接在 step 的 if 里引用）
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取资讯
        run: node scripts/fetch-news.mjs
        env:
          # 可选：仓库变量 SITE_URL 用来覆盖 data/feeds.json 里的 site.url，
          # 让 data/feed.xml 的 atom:link 指向当前主入口（未设置时用配置文件里的值）
          SITE_URL: ${{ vars.SITE_URL }}

      - name: 运行单元测试
        run: npm test

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/feed.xml
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新资讯 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 组装静态站点
        run: node scripts/build.mjs

      # 国内线路：阿里云 OSS 静态网站托管（需要自备域名，见 README「国内访问不稳定怎么办」）
      # 未配置 OSS_ACCESS_KEY_ID 时这一步自动跳过，workflow 照常绿
      - name: 同步到阿里云 OSS
        if: ${{ env.OSS_ACCESS_KEY_ID != '' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # 桶名，例如 ai-news-daily
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          # 地域 endpoint，本项目用香港：oss-cn-hongkong.aliyuncs.com（免备案）
          # 带不带 https:// 都行，脚本会自动补——因为 Bucket Policy 的「拒绝非加密传输」连自己人也拒
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "OSS_BUCKET=[${OSS_BUCKET:-}]  OSS_ENDPOINT=[${OSS_ENDPOINT:-}]"
          if [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::error::OSS_BUCKET 或 OSS_ENDPOINT 为空。这两个必须建在 Variables 页签（不是 Secrets 页签）"
            exit 1
          fi
          # endpoint 统一补上 https://：Bucket Policy 里那条「拒绝非加密传输」条件对所有人生效
          # （Principal: ["*"]，RAM 账号也不例外），走明文 HTTP 会被 AccessDenied 掉
          case "$OSS_ENDPOINT" in
            http://*|https://*) ENDPOINT="$OSS_ENDPOINT" ;;
            *) ENDPOINT="https://$OSS_ENDPOINT" ;;
          esac
          echo "实际使用的 endpoint: $ENDPOINT"
          echo "--- 下载 ossutil 1.7.19 ---"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          ls -l /tmp/ossutil.zip
          echo "dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343  /tmp/ossutil.zip" | sha256sum -c -
          # -o 覆盖不询问，-j 去掉 zip 内的目录层级（包内其实是 ossutil-v1.7.19-linux-amd64/ossutil64）
          unzip -q -o -j /tmp/ossutil.zip -d /tmp/ossutil
          ls -l /tmp/ossutil
          chmod +x /tmp/ossutil/ossutil64
          echo "--- 开始同步 ---"
          /tmp/ossutil/ossutil64 --version
          /tmp/ossutil/ossutil64 sync ./dist "oss://$OSS_BUCKET/" \
            -e "$ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --delete -f --jobs 10

      # 百度主动推送：把 sitemap 里的 URL POST 给百度「普通收录」接口，加快未备案站的收录。
      # token 取自百度站长平台，未配置时本步自动跳过，workflow 照常绿。
      # ⚠️ 新站每日配额很小（实测 10 条/天，随收录表现增长），只推前 10 条（首页 + 最新日期页），
      # 超出配额百度返回 4xx 属预期，打印返回体但不让 workflow 变红
      - name: 百度主动推送
        if: ${{ env.BAIDU_PUSH_TOKEN != '' }}
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||' | head -10 > /tmp/urls.txt
          SITE=$(head -1 /tmp/urls.txt | sed 's:/$::')
          echo "推送 $(wc -l < /tmp/urls.txt) 条 URL 到百度（site=$SITE）"
          # 返回 JSON：success=本次成功条数，remain=当日剩余配额；超额时返回 4xx 错误说明
          RESP=$(curl -sS -H 'Content-Type:text/plain' --data-binary @/tmp/urls.txt \
            "http://data.zz.baidu.com/urls?site=$SITE&token=$BAIDU_PUSH_TOKEN" || true)
          echo "百度返回: $RESP"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4