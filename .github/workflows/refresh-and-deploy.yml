name: 刷新资讯并发布

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # secret 放在 job 级 env 里，下面才能用 if 判断它是否已配置
    # （secrets 上下文不允许直接在 step 的 if 里引用）
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取资讯
        run: node scripts/fetch-news.mjs
        env:
          # 可选：仓库变量 SITE_URL 用来覆盖 data/feeds.json 里的 site.url，
          # 让 data/feed.xml 的 atom:link 指向当前主入口（未设置时用配置文件里的值）
          SITE_URL: ${{ vars.SITE_URL }}

      - name: 运行单元测试
        run: npm test

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/feed.xml
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新资讯 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 组装静态站点
        run: node scripts/build.mjs

      # 国内线路：阿里云 OSS 静态网站托管（需要自备域名，见 README「国内访问不稳定怎么办」）
      # 未配置 OSS_ACCESS_KEY_ID 时这一步自动跳过，workflow 照常绿
      - name: 同步到阿里云 OSS
        if: ${{ env.OSS_ACCESS_KEY_ID != '' }}
        run: |
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          echo "dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil
          chmod +x /tmp/ossutil/ossutil64
          /tmp/ossutil/ossutil64 sync ./dist "oss://$OSS_BUCKET/" \
            -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --delete -f --jobs 10
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # 桶名，例如 ai-news-daily
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          # 地域 endpoint 的二级域名形式，本项目用香港：oss-cn-hongkong.aliyuncs.com（免备案）
          # 想上大陆节点则改成如 oss-cn-hangzhou.aliyuncs.com（需先备案），不要带 https://
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4