<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>页面不存在 · AI 资讯速递</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f1e9;
        --text: #1d1c19;
        --text-2: #57534b;
        --brand: #c64132;
        --border: #ddd5c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181917;
          --text: #e9e5dc;
          --text-2: #b8b2a8;
          --brand: #d87a6b;
          --border: #373832;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 15px;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      .code {
        margin: 0;
        font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--brand);
      }
      h1 {
        margin: 8px 0 12px;
        font-family: 'Songti SC', 'STSong', serif;
        font-size: clamp(28px, 6vw, 40px);
        line-height: 1.25;
      }
      p {
        margin: 0 0 20px;
        color: var(--text-2);
      }
      a {
        color: var(--brand);
      }
      .button {
        display: inline-block;
        padding: 10px 18px;
        border: 1px solid var(--brand);
        border-radius: 3px;
        text-decoration: none;
      }
      .button:hover {
        background: var(--brand);
        color: var(--bg);
      }
      footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-2);
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · NOT FOUND</p>
      <h1>这条链接没有资讯</h1>
      <p>地址可能写错了，或者这天的归档已经过期。回到首页看最新一期 AI 资讯。</p>
      <a class="button" href="/">回到最新资讯</a>
      <footer>
        <strong>AI 资讯速递</strong> · <a href="/data/feed.xml">RSS 订阅</a>
      </footer>
    </main>
  </body>
</html>
