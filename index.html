      {
        "@context": "https://schema.org",

        "name": "AI 资讯速递",

        "url": "https://latestainews.cn/",
        "description": "每日 AI 新闻聚合：国内外模型发布、产品动态、研究前沿、行业动态，按天归档。",
        "inLanguage": "zh-CN"
      }
    </script>

    <link rel="apple-touch-icon" href="assets/logo.png" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script>
      var _hmt = _hmt || [];
      (function () {
        var hm = document.createElement('script');
        hm.src = 'https://hm.baidu.com/hm.js?d65cdac3fb208a23b8c35dd2823de651';

  </head>
  <body>
    <a class="skip-link" href="#feed">跳到资讯列表</a>
    <h1 class="sr-only">AI 资讯速递 · 每日 AI 新闻聚合</h1>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="#/all" aria-label="回到最新资讯">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/logo.png" width="34" height="34" alt="" />
          </span>
          <span class="brand-text">
            <strong>AI 资讯速递</strong>
            <small>LATEST AI NEWS</small>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="站点导航">
          <a href="#/all" data-nav="all">最新</a>
          <a href="#/bookmarks" data-nav="bookmarks">
            收藏 <span class="count-badge" data-bookmark-count hidden>0</span>
          </a>
          <button type="button" class="link-btn" data-action="about">关于</button>
          <a class="mobile-only" href="data/feed.xml" target="_blank" rel="noopener">RSS 订阅</a>
        </nav>

        <div class="topbar-tools">
          <button type="button" class="icon-btn" data-action="theme" title="切换深浅色" aria-label="切换深浅色">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path
                d="M10 2a8 8 0 108 8 6.5 6.5 0 01-8-8z"
                fill="currentColor"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn menu-btn"
            data-action="menu"
            aria-label="展开导航"
            aria-controls="nav"
            aria-expanded="false"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path d="M3 5h14v2H3zM3 9h14v2H3zM3 13h14v2H3z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap layout">
      <section class="main-col">
        <section class="hero" id="hero" aria-label="今日头条"></section>

        <section class="panel news-controls" aria-label="搜索与筛选">
          <label class="search">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <path
                d="M8.5 3a5.5 5.5 0 104.23 9.02l3.12 3.13a1 1 0 001.42-1.42l-3.13-3.12A5.5 5.5 0 008.5 3zm0 2a3.5 3.5 0 110 7 3.5 3.5 0 010-7z"
                fill="currentColor"
              />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="搜索标题 / 摘要 / 来源"
              autocomplete="off"
              aria-label="搜索资讯"
            />
            <kbd>/</kbd>
          </label>
          <div class="chip-row" id="catRow"></div>
          <details class="advanced-filters" id="advancedFilters">
            <summary>
              <span>更多筛选</span>
              <span class="filter-status" id="filterStatus" hidden>已调整</span>
            </summary>
            <div class="filter-row">
              <div class="seg" id="langSeg" role="group" aria-label="语言">
                <button type="button" data-lang="zh" class="is-active">中文</button>
                <button type="button" data-lang="en">英文</button>
                <button type="button" data-lang="all">全部语言</button>
              </div>
              <div class="seg" id="sortSeg" role="group" aria-label="排序">
                <button type="button" data-sort="time" class="is-active">按时间</button>
                <button type="button" data-sort="hot">按热度</button>
              </div>
              <label class="switch">
                <input type="checkbox" id="hideRead" />
                <span>隐藏已读</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="onlyPapers" />
                <span>只看论文</span>
              </label>
              <button type="button" class="ghost-btn" data-action="reset">重置筛选</button>
            </div>
          </details>
        </section>

        <div class="feed-head" id="feedHead"></div>
        <div class="feed" id="feed"></div>
        <div class="more-wrap" id="moreWrap" hidden>
          <button type="button" class="more-btn" id="loadMore">加载更多</button>
        </div>
        <div class="empty" id="empty" hidden></div>
      </section>

      <aside class="side-col">
        <section class="card calendar-card">
          <h2 class="card-title">按日期查询</h2>
          <div class="tabs" id="calTabs" role="tablist">
            <button type="button" data-mode="year">年</button>
            <button type="button" data-mode="month">月</button>
            <button type="button" data-mode="day" class="is-active">日</button>
          </div>
          <div class="calendar" id="calendar"></div>
        </section>

        <section class="card hot-card">
          <h2 class="card-title">热度榜 <small>TOP 10</small></h2>
          <ol class="hot-list" id="hotList"></ol>
        </section>
      </aside>
    </main>

    <section class="wrap stats-zone" id="statsZone" aria-label="次级统计">
      <section class="card stats-card">
        <h2 class="card-title">分类分布</h2>
        <div class="stat-list" id="catStats"></div>
      </section>

      <section class="card stats-card">
        <h2 class="card-title">来源分布</h2>
        <div class="stat-list" id="srcStats"></div>
      </section>

      <section class="card meta-card stats-card" id="dataMeta"></section>
    </section>

    <footer class="footer">
      <div class="wrap footer-inner">
        <p>
          <strong>AI 资讯速递</strong> — 个人自建的 AI 资讯聚合站，内容来自公开 RSS
          源，仅保留标题、摘要与原文链接，版权归原作者所有。
        </p>
        <p class="muted" id="footerMeta"></p>
        <p class="muted">
          订阅：<a class="footer-link" href="data/feed.xml" target="_blank" rel="noopener">RSS</a>
          · 数据由 <code>npm run fetch</code> 生成，可部署到任意静态托管
        </p>
      </div>
    </footer>

    <dialog class="dialog" id="aboutDialog">
      <form method="dialog" class="dialog-head">
        <h2>关于本站</h2>
        <button class="icon-btn" value="close" aria-label="关闭">✕</button>
      </form>
      <div class="dialog-body" id="aboutBody"></div>
    </dialog>

    <div class="toast" id="toast" hidden></div>

    <nav class="mobile-tabbar" id="mobileNav" aria-label="移动端功能导航">
      <a href="#/all" data-mobile-nav="all">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M5 6h14M5 12h14M5 18h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>最新</span>
      </a>
      <a href="#/archive" data-mobile-nav="archive">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="1" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>归档</span>
      </a>
      <a href="#/bookmarks" data-mobile-nav="bookmarks">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <span>收藏</span>
        <span class="count-badge" data-bookmark-count hidden>0</span>
      </a>
      <a href="#/stats" data-mobile-nav="stats">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M5 19V11M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>统计</span>
      </a>
    </nav>

    <button type="button" class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M10 4l6 6M10 4L4 10M10 4v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <script src="assets/app.js" type="module"></script>
  </body>
</html>
