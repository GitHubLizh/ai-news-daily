<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 资讯速递 · 每日 AI 动态聚合</title>
    <meta
      name="description"
      content="每日聚合国内外 AI 资讯：模型发布、产品动态、研究前沿、行业动态，按天归档，可按日期检索。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7l2.6 6.4L25 16l-6.4 2.6L16 25l-2.6-6.4L7 16l6.4-2.6z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#feed">跳到资讯列表</a>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="#/today" aria-label="回到今日">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26">
              <path
                d="M16 4l3.2 7.9L27 15l-7.8 3.1L16 26l-3.2-7.9L5 15l7.8-3.1z"
                fill="currentColor"
              />
            </svg>
          </span>
          <span class="brand-text">
            <strong>AI 资讯速递</strong>
            <small>每日 AI 动态 · 精选聚合</small>
          </span>
        </a>

        <nav class="nav" id="nav">
          <a href="#/today" data-nav="today">今日</a>
          <a href="#/all" data-nav="all">全部</a>
          <a href="#/bookmarks" data-nav="bookmarks">
            收藏 <span class="count-badge" id="bmCount" hidden>0</span>
          </a>
          <button type="button" class="link-btn" data-action="about">关于</button>
        </nav>

        <div class="topbar-tools">
          <label class="search">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <path
                d="M8.5 3a5.5 5.5 0 104.23 9.02l3.12 3.13a1 1 0 001.42-1.42l-3.13-3.12A5.5 5.5 0 008.5 3zm0 2a3.5 3.5 0 110 7 3.5 3.5 0 010-7z"
                fill="currentColor"
              />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="搜索标题 / 摘要 / 来源"
              autocomplete="off"
              aria-label="搜索资讯"
            />
            <kbd>/</kbd>
          </label>
          <button type="button" class="icon-btn" data-action="theme" title="切换深浅色" aria-label="切换深浅色">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path
                d="M10 2a8 8 0 108 8 6.5 6.5 0 01-8-8z"
                fill="currentColor"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn menu-btn"
            data-action="menu"
            aria-label="展开导航"
            aria-expanded="false"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
              <path d="M3 5h14v2H3zM3 9h14v2H3zM3 13h14v2H3z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap layout">
      <section class="main-col">
        <section class="hero" id="hero" aria-label="今日头条"></section>

        <section class="panel" aria-label="筛选">
          <div class="chip-row" id="catRow"></div>
          <div class="filter-row">
            <div class="seg" id="langSeg" role="group" aria-label="语言">
              <button type="button" data-lang="all" class="is-active">全部语言</button>
              <button type="button" data-lang="zh">中文</button>
              <button type="button" data-lang="en">英文</button>
            </div>
            <div class="seg" id="sortSeg" role="group" aria-label="排序">
              <button type="button" data-sort="time" class="is-active">按时间</button>
              <button type="button" data-sort="hot">按热度</button>
            </div>
            <label class="switch">
              <input type="checkbox" id="hideRead" />
              <span>隐藏已读</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="onlyPapers" />
              <span>只看论文</span>
            </label>
            <button type="button" class="ghost-btn" data-action="reset">重置筛选</button>
          </div>
        </section>

        <div class="feed-head" id="feedHead"></div>
        <div class="feed" id="feed"></div>
        <div class="more-wrap" id="moreWrap" hidden>
          <button type="button" class="more-btn" id="loadMore">加载更多</button>
        </div>
        <div class="empty" id="empty" hidden></div>
      </section>

      <aside class="side-col">
        <section class="card">
          <h2 class="card-title">按日期查询</h2>
          <div class="tabs" id="calTabs" role="tablist">
            <button type="button" data-mode="year">年</button>
            <button type="button" data-mode="month">月</button>
            <button type="button" data-mode="day" class="is-active">日</button>
          </div>
          <div class="calendar" id="calendar"></div>
        </section>

        <section class="card">
          <h2 class="card-title">分类分布</h2>
          <div class="stat-list" id="catStats"></div>
        </section>

        <section class="card">
          <h2 class="card-title">热度榜 <small>TOP 10</small></h2>
          <ol class="hot-list" id="hotList"></ol>
        </section>

        <section class="card">
          <h2 class="card-title">来源分布</h2>
          <div class="stat-list" id="srcStats"></div>
        </section>

        <section class="card meta-card" id="dataMeta"></section>
      </aside>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner">
        <p>
          <strong>AI 资讯速递</strong> — 个人自建的 AI 资讯聚合站，内容来自公开 RSS
          源，仅保留标题、摘要与原文链接，版权归原作者所有。
        </p>
        <p class="muted" id="footerMeta"></p>
        <p class="muted">
          订阅：<a class="footer-link" href="data/feed.xml" target="_blank" rel="noopener">RSS</a>
          · 数据由 <code>npm run fetch</code> 生成，可部署到任意静态托管
        </p>
      </div>
    </footer>

    <dialog class="dialog" id="aboutDialog">
      <form method="dialog" class="dialog-head">
        <h2>关于本站</h2>
        <button class="icon-btn" value="close" aria-label="关闭">✕</button>
      </form>
      <div class="dialog-body" id="aboutBody"></div>
    </dialog>

    <div class="toast" id="toast" hidden></div>

    <script src="assets/app.js" type="module"></script>
  </body>
</html>
